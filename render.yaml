services:
  - type: web
    name: slash-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_NAME
        value: Slash India
      - key: DEBUG
        value: "false"
      - key: FRONTEND_URL
        value: https://slash-xi.vercel.app
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: AMAZON_AFFILIATE_TAG
        value: slashdeals-21
      - key: CUELINKS_PUB_ID
        sync: false
      - key: EARNKARO_API_KEY
        sync: false
